name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotNetCqrsIntro.sln

      - name: Build
        run: dotnet build DotNetCqrsIntro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DotNetCqrsIntro.sln --no-build --configuration Release --logger "console;verbosity=normal"
        env:
          # The apps default to the in-memory storage profile; setting it explicitly
          # documents that CI deliberately runs without a PostgreSQL service.
          Storage__Provider: InMemory
